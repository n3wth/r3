name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., patch, minor, major, or specific version)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test --ignore-scripts || true
        continue-on-error: true

      - name: Bump version
        id: version
        run: |
          NEW_VERSION=$(npm version ${{ github.event.inputs.version }} --no-git-tag-version)
          echo "new_version=${NEW_VERSION#v}" >> $GITHUB_OUTPUT
          npm run sync-version
          git add package.json package-lock.json website/lib/version.ts
          git commit -m "chore(release): ${NEW_VERSION}

          Co-Authored-By: GitHub Actions <actions@github.com>"

      - name: Push changes
        run: |
          git push origin main
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: v${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          body: |
            ## r3 v${{ steps.version.outputs.new_version }}

            ### Install
            ```bash
            npm install @n3wth/r3@${{ steps.version.outputs.new_version }}
            ```

            ### Run
            ```bash
            npx @n3wth/r3
            ```

            ### Docs
            [r3.n3wth.com](https://r3.n3wth.com)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "lib/**"
      - "package.json"
      - "tsconfig.json"

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check if this version is already published
          if npm view @n3wth/r3@$CURRENT_VERSION version 2>/dev/null; then
            echo "Version $CURRENT_VERSION already published"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version $CURRENT_VERSION detected"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.version-check.outputs.should_release == 'true'
        run: npm ci --ignore-scripts

      - name: Build package
        if: steps.version-check.outputs.should_release == 'true'
        run: npm run build

      - name: Run tests
        if: steps.version-check.outputs.should_release == 'true'
        run: npm test --ignore-scripts || true
        continue-on-error: true

      - name: Create GitHub Release
        if: steps.version-check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version-check.outputs.current_version }}
          name: v${{ steps.version-check.outputs.current_version }}
          generate_release_notes: true
          body: |
            ## R3 v${{ steps.version-check.outputs.current_version }}

            Intelligent memory layer for AI applications with sub-5ms response times.

            ### Installation
            ```bash
            npm install @n3wth/r3@${{ steps.version-check.outputs.current_version }}
            ```

            ### Claude Desktop Setup
            ```bash
            npx @n3wth/r3
            ```

            ### Documentation
            - [Getting Started](https://r3.newth.ai/docs/quickstart)
            - [API Reference](https://r3.newth.ai/docs/api-reference)

            ---
            *npm publish is handled by the NPM Package workflow on release creation.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
